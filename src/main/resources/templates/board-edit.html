<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>철학 자유게시판 - 수정</title>
<link rel="stylesheet" th:href="@{/css/board-common.css}">
</head>
<body>

<div style="max-width: 1080px; margin: 0 auto; padding: 32px 24px 60px;">

    <p class="page-title">철학 자유게시판 - 수정</p>

    <div class="info-block">
        <div class="info-row">
            <span class="info-label">작성자</span>
            <span class="info-value" th:text="${boardDetail.author}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">등록일시</span>
            <span class="info-value" th:text="${#temporals.format(boardDetail.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
        </div>
        <div class="info-row" th:if="${boardDetail.updatedAt != null}">
            <span class="info-label">수정일시</span>
            <span class="info-value" th:text="${#temporals.format(boardDetail.updatedAt, 'yyyy.MM.dd HH:mm')}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">조회수</span>
            <span class="info-value" th:text="${boardDetail.viewCount}"></span>
        </div>
    </div>

    <form id="editForm" th:data-id="${boardDetail.id}">
        <div class="form-row">
            <span class="form-label">카테고리 *</span>
            <div class="form-body">
                <div class="field">
                    <select class="select-input" id="categoryId" required>
                        <option value="" disabled>카테고리 선택</option>
                        <option th:each="category : ${categoryList}"
                                th:value="${category.id}"
                                th:selected="${category.id == boardDetail.categoryId}"
                                th:text="${category.name}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-row">
            <span class="form-label">제목 *</span>
            <div class="form-body">
                <div class="field">
                    <input class="text-input" type="text" id="title" th:value="${boardDetail.title}"
                           placeholder="제목을 입력해 주세요" maxlength="200" required>
                </div>
            </div>
        </div>

        <div class="form-row">
            <span class="form-label">내용 *</span>
            <div class="form-body">
                <div class="field textarea-field">
                    <textarea class="text-input content-textarea" id="content"
                              placeholder="내용을 입력해 주세요" required th:text="${boardDetail.content}"></textarea>
                </div>
            </div>
        </div>

        <div class="form-row">
            <span class="form-label">첨부파일</span>
            <div class="form-body">
                <p class="attachment-hint">최대 3개까지 첨부할 수 있어요 (jpg, jpeg, png, pdf / 개당 10MB 이하)</p>
                <div class="attachment-existing-list" id="existingAttachments">
                    <div class="attachment-existing-row" th:each="attachment : ${attachmentList}" th:data-id="${attachment.id}">
                        <a class="attachment-link" th:href="@{/attachment/{id}(id=${attachment.id})}">
                            <span th:text="${#strings.toLowerCase(#strings.substringAfter(attachment.originalFileName, '.')) == 'pdf'} ? '📄' : '🖼️'"></span>
                            <span th:text="${attachment.originalFileName}"></span>
                        </a>
                        <span class="attachment-file-meta">
                            <span th:text="${attachment.contentType}"></span>
                            <span class="sep">·</span>
                            <span class="attachment-file-size" th:attr="data-size=${attachment.size}"></span>
                        </span>
                        <button type="button" class="attachment-remove" onclick="removeExistingAttachment(this)">✕</button>
                    </div>
                </div>
                <div class="attachment-slots" id="attachmentSlots" th:attr="data-existing-count=${#lists.size(attachmentList)}"></div>
            </div>
        </div>

        <div class="form-footer">
            <a th:href="@{/board/{boardId}(boardId=${boardDetail.id})}" class="btn-secondary">취소</a>
            <button type="submit" class="btn-primary">저장</button>
        </div>
    </form>

</div>

<div class="layer-backdrop" id="editConfirmLayer" style="display:none;">
    <div class="layer-card">
        <p class="layer-title">비밀번호 확인</p>
        <div class="field">
            <input class="text-input" type="password" id="editPassword" placeholder="등록 시 입력한 비밀번호">
        </div>
        <div class="layer-footer">
            <button type="button" class="btn-secondary" onclick="closeEditConfirm()">취소</button>
            <button type="button" class="btn-primary" id="editConfirmBtn" disabled onclick="submitEdit()">확인</button>
        </div>
    </div>
</div>

<script th:inline="none">
    var MAX_ATTACHMENTS = 3;
    var MAX_ATTACHMENT_SIZE = 10 * 1024 * 1024; // 10MB
    var ALLOWED_ATTACHMENT_EXT = ['jpg', 'jpeg', 'png', 'pdf'];

    var attachmentSlots = document.getElementById('attachmentSlots');
    var existingCount = Number(attachmentSlots.dataset.existingCount);
    var slotCount = Math.max(0, MAX_ATTACHMENTS - existingCount);

    var attachments = new Array(slotCount).fill(null); // 슬롯별 { file, name, status: 'uploading'|'done'|'error', attachmentId }
    var removeAttachmentIds = []; // 삭제 표시된 기존 첨부파일 id 목록

    function getAttachmentExtension(fileName) {
        var idx = fileName.lastIndexOf('.');
        if (idx === -1) {
            return '';
        }
        return fileName.slice(idx + 1).toLowerCase();
    }

    function firstEmptySlotIndex() {
        for (var i = 0; i < attachments.length; i++) {
            if (attachments[i] === null) {
                return i;
            }
        }
        return -1;
    }

    function uploadAttachment(index) {
        var entry = attachments[index];
        var formData = new FormData();
        formData.append('file', entry.file);

        fetch('/attachment', {
            method: 'POST',
            body: formData
        }).then(function (res) {
            if (!res.ok) {
                throw new Error('업로드 실패');
            }
            return res.json();
        }).then(function (data) {
            entry.status = 'done';
            entry.attachmentId = data.id;
            renderAttachmentSlots();
        }).catch(function () {
            entry.status = 'error';
            renderAttachmentSlots();
        });
    }

    function handleSlotFileSelected(index, file) {
        var ext = getAttachmentExtension(file.name);
        var entry = {
            file: file,
            name: file.name,
            status: 'uploading',
            attachmentId: null
        };

        if (ALLOWED_ATTACHMENT_EXT.indexOf(ext) === -1 || file.size > MAX_ATTACHMENT_SIZE) {
            entry.status = 'error';
            attachments[index] = entry;
            renderAttachmentSlots();
            return;
        }

        attachments[index] = entry;
        renderAttachmentSlots();
        uploadAttachment(index);
    }

    function renderAttachmentSlots() {
        attachmentSlots.innerHTML = '';
        var activeIndex = firstEmptySlotIndex();

        attachments.forEach(function (entry, index) {
            var row = document.createElement('div');
            row.className = 'attachment-slot';

            if (entry) {
                row.classList.add('filled');

                var nameSpan = document.createElement('span');
                nameSpan.className = 'attachment-name';
                nameSpan.textContent = entry.name;
                row.appendChild(nameSpan);

                var statusSpan = document.createElement('span');
                statusSpan.className = 'attachment-status ' + entry.status;
                statusSpan.textContent =
                    entry.status === 'uploading' ? '업로드 중' :
                    entry.status === 'done' ? '완료' : '실패';
                row.appendChild(statusSpan);

                var removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'attachment-remove';
                removeBtn.textContent = '✕';
                removeBtn.addEventListener('click', function () {
                    attachments[index] = null;
                    renderAttachmentSlots();
                });
                row.appendChild(removeBtn);
            } else {
                var label = document.createElement('label');
                label.className = 'attachment-slot-picker' + (index === activeIndex ? '' : ' disabled');

                var input = document.createElement('input');
                input.type = 'file';
                input.accept = '.jpg,.jpeg,.png,.pdf';
                input.disabled = index !== activeIndex;
                input.addEventListener('change', function () {
                    if (input.files[0]) {
                        handleSlotFileSelected(index, input.files[0]);
                    }
                });

                var labelText = document.createElement('span');
                labelText.textContent = '파일 선택';

                label.appendChild(input);
                label.appendChild(labelText);
                row.appendChild(label);
            }

            attachmentSlots.appendChild(row);
        });
    }

    renderAttachmentSlots();

    function removeExistingAttachment(button) {
        var row = button.closest('.attachment-existing-row');
        removeAttachmentIds.push(Number(row.dataset.id));
        row.remove();
    }

    function formatFileSize(bytes) {
        if (bytes < 1024) {
            return bytes + ' B';
        }
        var units = ['KB', 'MB', 'GB'];
        var value = bytes;
        var unitIndex = -1;
        do {
            value /= 1024;
            unitIndex++;
        } while (value >= 1024 && unitIndex < units.length - 1);
        return value.toFixed(1) + ' ' + units[unitIndex];
    }

    document.querySelectorAll('.attachment-file-size').forEach(function (el) {
        el.textContent = formatFileSize(Number(el.dataset.size));
    });

    document.getElementById('editForm').addEventListener('submit', function (e) {
        e.preventDefault();

        var categoryId = document.getElementById('categoryId').value;
        var title = document.getElementById('title').value.trim();
        var content = document.getElementById('content').value.trim();

        if (!categoryId) {
            alert('카테고리를 선택해 주세요.');
            return;
        }
        if (title.length === 0) {
            alert('제목을 입력해 주세요.');
            return;
        }
        if (content.length === 0) {
            alert('내용을 입력해 주세요.');
            return;
        }
        if (attachments.some(function (a) { return a && a.status === 'uploading'; })) {
            alert('첨부파일 업로드가 끝난 후 저장해 주세요.');
            return;
        }

        document.getElementById('editConfirmLayer').style.display = 'flex';
    });

    document.getElementById('editPassword').addEventListener('input', function (e) {
        document.getElementById('editConfirmBtn').disabled = e.target.value.length === 0;
    });

    function closeEditConfirm() {
        document.getElementById('editConfirmLayer').style.display = 'none';
        document.getElementById('editPassword').value = '';
        document.getElementById('editConfirmBtn').disabled = true;
    }

    function submitEdit() {
        var id = document.getElementById('editForm').dataset.id;
        var categoryId = document.getElementById('categoryId').value;
        var title = document.getElementById('title').value.trim();
        var content = document.getElementById('content').value.trim();
        var password = document.getElementById('editPassword').value;

        var newAttachmentIds = attachments
            .filter(function (a) { return a && a.status === 'done'; })
            .map(function (a) { return a.attachmentId; });

        fetch('/board/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                categoryId: Number(categoryId),
                password: password,
                title: title,
                content: content,
                newAttachmentIds: newAttachmentIds,
                removeAttachmentIds: removeAttachmentIds
            })
        }).then(function (res) {
            if (res.ok) {
                window.location.href = '/board/' + id;
            } else {
                alert('비밀번호가 일치하지 않습니다.');
            }
        });
    }
</script>

</body>
</html>
