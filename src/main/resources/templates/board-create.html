<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>철학 자유게시판 - 등록</title>
<link rel="stylesheet" th:href="@{/css/board-common.css}">
</head>
<body>

<div style="max-width: 1080px; margin: 0 auto; padding: 32px 24px 60px;">

    <p class="page-title">철학 자유게시판 - 등록</p>

    <form id="createForm">
        <div class="form-row">
            <span class="form-label">카테고리 *</span>
            <div class="form-body">
                <div class="field">
                    <select class="select-input" id="categoryId" required>
                        <option value="" disabled selected>카테고리 선택</option>
                        <option th:each="category : ${categoryList}"
                                th:value="${category.id}"
                                th:text="${category.name}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-row">
            <span class="form-label">작성자 *</span>
            <div class="form-body">
                <div class="field">
                    <input class="text-input" type="text" id="author"
                           placeholder="작성자명을 입력해 주세요" maxlength="20" required>
                </div>
            </div>
        </div>

        <div class="form-row">
            <span class="form-label">비밀번호 *</span>
            <div class="form-body">
                <div class="field">
                    <input class="text-input" type="password" id="password"
                           placeholder="영문, 숫자, 특수문자(@$!%*#?&) 포함 8~20자" maxlength="20" required>
                </div>
            </div>
        </div>

        <div class="form-row">
            <span class="form-label">제목 *</span>
            <div class="form-body">
                <div class="field">
                    <input class="text-input" type="text" id="title"
                           placeholder="제목을 입력해 주세요" maxlength="200" required>
                </div>
            </div>
        </div>

        <div class="form-row">
            <span class="form-label">내용 *</span>
            <div class="form-body">
                <div class="field textarea-field">
                    <textarea class="text-input content-textarea" id="content"
                              placeholder="내용을 입력해 주세요" required></textarea>
                </div>
            </div>
        </div>

        <div class="form-row">
            <span class="form-label">첨부파일</span>
            <div class="form-body">
                <p class="attachment-hint">최대 3개까지 첨부할 수 있어요 (jpg, jpeg, png, pdf / 개당 10MB 이하)</p>
                <div class="attachment-slots" id="attachmentSlots"></div>
            </div>
        </div>

        <div class="form-footer">
            <a th:href="@{/board}" class="btn-secondary">취소</a>
            <button type="submit" class="btn-primary">등록</button>
        </div>
    </form>

</div>

<script th:inline="none">
    var MAX_ATTACHMENTS = 3;
    var MAX_ATTACHMENT_SIZE = 10 * 1024 * 1024; // 10MB
    var ALLOWED_ATTACHMENT_EXT = ['jpg', 'jpeg', 'png', 'pdf'];

    var attachments = [null, null, null]; // 슬롯별 { file, name, status: 'uploading'|'done'|'error', attachmentId }

    var attachmentSlots = document.getElementById('attachmentSlots');

    function getAttachmentExtension(fileName) {
        var idx = fileName.lastIndexOf('.');
        if (idx === -1) {
            return '';
        }
        return fileName.slice(idx + 1).toLowerCase();
    }

    function firstEmptySlotIndex() {
        for (var i = 0; i < attachments.length; i++) {
            if (attachments[i] === null) {
                return i;
            }
        }
        return -1;
    }

    function uploadAttachment(index) {
        var entry = attachments[index];
        var formData = new FormData();
        formData.append('file', entry.file);

        fetch('/attachment', {
            method: 'POST',
            body: formData
        }).then(function (res) {
            if (!res.ok) {
                throw new Error('업로드 실패');
            }
            return res.json();
        }).then(function (data) {
            entry.status = 'done';
            entry.attachmentId = data.id;
            renderAttachmentSlots();
        }).catch(function () {
            entry.status = 'error';
            renderAttachmentSlots();
        });
    }

    function handleSlotFileSelected(index, file) {
        var ext = getAttachmentExtension(file.name);
        var entry = {
            file: file,
            name: file.name,
            status: 'uploading',
            attachmentId: null
        };

        if (ALLOWED_ATTACHMENT_EXT.indexOf(ext) === -1 || file.size > MAX_ATTACHMENT_SIZE) {
            entry.status = 'error';
            attachments[index] = entry;
            renderAttachmentSlots();
            return;
        }

        attachments[index] = entry;
        renderAttachmentSlots();
        uploadAttachment(index);
    }

    function renderAttachmentSlots() {
        attachmentSlots.innerHTML = '';
        var activeIndex = firstEmptySlotIndex();

        attachments.forEach(function (entry, index) {
            var row = document.createElement('div');
            row.className = 'attachment-slot';

            if (entry) {
                row.classList.add('filled');

                var nameSpan = document.createElement('span');
                nameSpan.className = 'attachment-name';
                nameSpan.textContent = entry.name;
                row.appendChild(nameSpan);

                var statusSpan = document.createElement('span');
                statusSpan.className = 'attachment-status ' + entry.status;
                statusSpan.textContent =
                    entry.status === 'uploading' ? '업로드 중' :
                    entry.status === 'done' ? '완료' : '실패';
                row.appendChild(statusSpan);

                var removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'attachment-remove';
                removeBtn.textContent = '✕';
                removeBtn.addEventListener('click', function () {
                    attachments[index] = null;
                    renderAttachmentSlots();
                });
                row.appendChild(removeBtn);
            } else {
                var label = document.createElement('label');
                label.className = 'attachment-slot-picker' + (index === activeIndex ? '' : ' disabled');

                var input = document.createElement('input');
                input.type = 'file';
                input.accept = '.jpg,.jpeg,.png,.pdf';
                input.disabled = index !== activeIndex;
                input.addEventListener('change', function () {
                    if (input.files[0]) {
                        handleSlotFileSelected(index, input.files[0]);
                    }
                });

                var labelText = document.createElement('span');
                labelText.textContent = '파일 선택';

                label.appendChild(input);
                label.appendChild(labelText);
                row.appendChild(label);
            }

            attachmentSlots.appendChild(row);
        });
    }

    renderAttachmentSlots();

    document.getElementById('createForm').addEventListener('submit', function (e) {
        e.preventDefault();

        var categoryId = document.getElementById('categoryId').value;
        var author = document.getElementById('author').value.trim();
        var password = document.getElementById('password').value;
        var title = document.getElementById('title').value.trim();
        var content = document.getElementById('content').value.trim();

        if (!categoryId) {
            alert('카테고리를 선택해 주세요.');
            return;
        }
        if (author.length === 0) {
            alert('작성자명을 입력해 주세요.');
            return;
        }
        if (!/^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,20}$/.test(password)) {
            alert('비밀번호는 영문, 숫자, 특수문자(@$!%*#?&)를 포함해 8~20자로 입력해 주세요.');
            return;
        }
        if (title.length === 0) {
            alert('제목을 입력해 주세요.');
            return;
        }
        if (content.length === 0) {
            alert('내용을 입력해 주세요.');
            return;
        }
        if (attachments.some(function (a) { return a && a.status === 'uploading'; })) {
            alert('첨부파일 업로드가 끝난 후 등록해 주세요.');
            return;
        }

        var attachmentIds = attachments
            .filter(function (a) { return a && a.status === 'done'; })
            .map(function (a) { return a.attachmentId; });

        fetch('/board', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                categoryId: Number(categoryId),
                author: author,
                password: password,
                title: title,
                content: content,
                attachmentIds: attachmentIds
            })
        }).then(function (res) {
            if (res.ok) {
                res.json().then(function (data) {
                    window.location.href = '/board/' + data.boardId;
                }).catch(function () {
                    window.location.href = '/board';
                });
            } else {
                alert('등록에 실패했습니다.');
            }
        });
    });
</script>

</body>
</html>
