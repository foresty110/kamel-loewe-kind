<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피드 게시판 - 수정</title>
<link rel="stylesheet" th:href="@{/css/board-common.css}">
</head>
<body>

<div style="max-width: 1080px; margin: 0 auto; padding: 32px 24px 60px;">

    <p class="page-title">피드 게시판 - 수정</p>

    <div class="info-block">
        <div class="info-row">
            <span class="info-label">작성자</span>
            <span class="info-value" th:text="${FeedEdit.author}"></span>
        </div>
        <div class="info-row">
            <span class="info-label">등록일시</span>
            <span class="info-value" th:text="${#temporals.format(FeedEdit.createdAt, 'yyyy.MM.dd HH:mm')}"></span>
        </div>
    </div>

    <form id="editForm" th:data-id="${FeedEdit.id}">
        <div class="form-row">
            <span class="form-label">제목 *</span>
            <div class="form-body">
                <div class="field">
                    <input class="text-input" type="text" id="title" th:value="${FeedEdit.title}"
                           placeholder="제목을 입력해 주세요" maxlength="200" required>
                </div>
            </div>
        </div>

        <div class="form-row">
            <span class="form-label">내용 *</span>
            <div class="form-body">
                <div class="field textarea-field">
                    <textarea class="text-input content-textarea" id="content"
                              placeholder="내용을 입력해 주세요" required th:text="${FeedEdit.content}"></textarea>
                </div>
            </div>
        </div>

        <div class="form-row">
            <span class="form-label">대표 이미지</span>
            <div class="form-body">
                <p class="attachment-hint">이미지 1장만 첨부할 수 있어요 (jpg, jpeg, png / 10MB 이하)</p>

                <div class="feed-edit-image" id="currentImage" th:if="${FeedEdit.imageId != null}" th:data-id="${FeedEdit.imageId}">
                    <img th:src="@{/attachment/{id}/view(id=${FeedEdit.imageId})}" alt="">
                    <button type="button" class="attachment-remove" onclick="removeCurrentImage()">✕</button>
                </div>

                <div id="imageSlot"></div>
            </div>
        </div>

        <div class="form-footer">
            <a th:href="@{/feed/{boardId}(boardId=${FeedEdit.id})}" class="btn-secondary">취소</a>
            <button type="submit" class="btn-primary">저장</button>
        </div>
    </form>

</div>

<div class="layer-backdrop" id="editConfirmLayer" style="display:none;">
    <div class="layer-card">
        <p class="layer-title">비밀번호 확인</p>
        <div class="field">
            <input class="text-input" type="password" id="editPassword" placeholder="등록 시 입력한 비밀번호">
        </div>
        <div class="layer-footer">
            <button type="button" class="btn-secondary" onclick="closeEditConfirm()">취소</button>
            <button type="button" class="btn-primary" id="editConfirmBtn" disabled onclick="submitEdit()">확인</button>
        </div>
    </div>
</div>

<script th:inline="none">
    var MAX_IMAGE_SIZE = 10 * 1024 * 1024; // 10MB
    var ALLOWED_IMAGE_EXT = ['jpg', 'jpeg', 'png'];

    var newImage = null; // { file, name, status: 'uploading'|'done'|'error', attachmentId }
    var removeAttachmentIds = []; // 삭제할 기존 첨부파일 id 목록 (대표 이미지 교체·제거 시 채워짐)

    var currentImageEl = document.getElementById('currentImage');
    var imageSlot = document.getElementById('imageSlot');

    function getExtension(fileName) {
        var idx = fileName.lastIndexOf('.');
        if (idx === -1) {
            return '';
        }
        return fileName.slice(idx + 1).toLowerCase();
    }

    function removeCurrentImage() {
        if (currentImageEl) {
            removeAttachmentIds.push(Number(currentImageEl.dataset.id));
            currentImageEl.remove();
            currentImageEl = null;
        }
    }

    function uploadImage() {
        var formData = new FormData();
        formData.append('file', newImage.file);

        fetch('/attachment', {
            method: 'POST',
            body: formData
        }).then(function (res) {
            if (!res.ok) {
                throw new Error('업로드 실패');
            }
            return res.json();
        }).then(function (data) {
            newImage.status = 'done';
            newImage.attachmentId = data.id;
            renderImageSlot();
        }).catch(function () {
            newImage.status = 'error';
            renderImageSlot();
        });
    }

    function handleFileSelected(file) {
        var ext = getExtension(file.name);
        newImage = {
            file: file,
            name: file.name,
            status: 'uploading',
            attachmentId: null
        };

        if (ALLOWED_IMAGE_EXT.indexOf(ext) === -1 || file.size > MAX_IMAGE_SIZE) {
            newImage.status = 'error';
            renderImageSlot();
            return;
        }

        // 대표 이미지는 최대 1장이라, 새 파일을 고르면 기존 이미지는 제거 대상으로 표시
        removeCurrentImage();

        renderImageSlot();
        uploadImage();
    }

    function renderImageSlot() {
        imageSlot.innerHTML = '';

        if (newImage) {
            var row = document.createElement('div');
            row.className = 'attachment-slot filled';

            var nameSpan = document.createElement('span');
            nameSpan.className = 'attachment-name';
            nameSpan.textContent = newImage.name;
            row.appendChild(nameSpan);

            var statusSpan = document.createElement('span');
            statusSpan.className = 'attachment-status ' + newImage.status;
            statusSpan.textContent =
                newImage.status === 'uploading' ? '업로드 중' :
                newImage.status === 'done' ? '완료' : '실패';
            row.appendChild(statusSpan);

            var removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'attachment-remove';
            removeBtn.textContent = '✕';
            removeBtn.addEventListener('click', function () {
                newImage = null;
                renderImageSlot();
            });
            row.appendChild(removeBtn);

            imageSlot.appendChild(row);
            return;
        }

        var label = document.createElement('label');
        label.className = 'attachment-slot-picker';

        var input = document.createElement('input');
        input.type = 'file';
        input.accept = '.jpg,.jpeg,.png';
        input.addEventListener('change', function () {
            if (input.files[0]) {
                handleFileSelected(input.files[0]);
            }
        });

        var labelText = document.createElement('span');
        labelText.textContent = '파일 선택';

        label.appendChild(input);
        label.appendChild(labelText);
        imageSlot.appendChild(label);
    }

    renderImageSlot();

    document.getElementById('editForm').addEventListener('submit', function (e) {
        e.preventDefault();

        var title = document.getElementById('title').value.trim();
        var content = document.getElementById('content').value.trim();

        if (title.length === 0) {
            alert('제목을 입력해 주세요.');
            return;
        }
        if (content.length === 0) {
            alert('내용을 입력해 주세요.');
            return;
        }
        if (newImage && newImage.status === 'uploading') {
            alert('이미지 업로드가 끝난 후 저장해 주세요.');
            return;
        }

        document.getElementById('editConfirmLayer').style.display = 'flex';
    });

    document.getElementById('editPassword').addEventListener('input', function (e) {
        document.getElementById('editConfirmBtn').disabled = e.target.value.length === 0;
    });

    function closeEditConfirm() {
        document.getElementById('editConfirmLayer').style.display = 'none';
        document.getElementById('editPassword').value = '';
        document.getElementById('editConfirmBtn').disabled = true;
    }

    function submitEdit() {
        var form = document.getElementById('editForm');
        var id = form.dataset.id;
        var title = document.getElementById('title').value.trim();
        var content = document.getElementById('content').value.trim();
        var password = document.getElementById('editPassword').value;

        var newImageId = (newImage && newImage.status === 'done') ? newImage.attachmentId : null;
        var removeImageId = removeAttachmentIds.length > 0 ? removeAttachmentIds[0] : null;

        fetch('/feed/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                password: password,
                title: title,
                content: content,
                newImageId: newImageId,
                removeImageId: removeImageId
            })
        }).then(function (res) {
            if (res.ok) {
                window.location.href = '/feed/' + id;
            } else {
                alert('비밀번호가 일치하지 않습니다.');
            }
        });
    }
</script>

</body>
</html>
